# Entigo fork only: builds the image and publishes it to Docker Hub as
# entigolabs/mcp-for-argocd. This file lives on the `entigo` branch and is not
# meant for upstream.
#
#   pull request to `entigo`  -> lint, test, build, vulnerability scan
#   push to `entigo`          -> the same, nothing is published
#   tag v<upstream>-entigo.<n> -> the same, then publish <upstream>-entigo.<n>
name: Entigo image

on:
  pull_request:
    branches:
      - entigo
  push:
    branches:
      - entigo
    tags:
      - "v*-entigo.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entigo-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: entigolabs/mcp-for-argocd

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test

  image:
    name: Build, scan and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx build --pull --load -t "$IMAGE:$VERSION" .

      - name: Scan image for vulnerabilities
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:$VERSION"

      - name: Log in to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch image
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -t "$IMAGE:$VERSION" .
          echo "Published \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
